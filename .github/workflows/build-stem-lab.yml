name: Build SCHRAUBI RFT Sample Lab V3

on:
  push:
    branches:
      - codex/stem-lab-flp
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install FLP tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install "git+https://github.com/CryptoJones/FL-Studio-MCP-Server.git"

      - name: Build and validate FLP package
        run: python tools/build_stem_lab.py

      - name: Show generated files
        run: |
          find dist -maxdepth 4 -type f -printf '%p %k KB\n' | sort
          find fl_live_setup -maxdepth 2 -type f -printf '%p %k KB\n' | sort

      - name: Upload project artifact
        uses: actions/upload-artifact@v4
        with:
          name: SCHRAUBI-RFT-SAMPLE-LAB-V3
          path: |
            dist/SCHRAUBI_RFT_SAMPLE_LAB_V3.flp
            dist/SCHRAUBI_RFT_SAMPLE_LAB_V3.zip
            dist/SCHRAUBI_RFT_SAMPLE_LAB_V3/**
            fl_live_setup/**
          if-no-files-found: error
